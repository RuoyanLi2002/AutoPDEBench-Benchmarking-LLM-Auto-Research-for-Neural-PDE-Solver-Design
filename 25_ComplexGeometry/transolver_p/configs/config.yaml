data:
  dataset_root: 
  data_save_path: 
  save_dir: 
  preprocessed: false
  fold_id: 0
  cfd_mesh: true
  r: null
  use_height: false
  
model:
  input_dim: 7
  latent_dim: 128
  num_head: 8
  dropout: 0.0
  mlp_ratio: 4.0
  slice_num: 128
  n_layers: 8
  output_dim: 4
  space_dim: 0

training:
  exp_name: ShapNetCar/run0
  seed: 42
  num_epochs: 100
  batch_size: 1
  save_freq: 5
  model_path: "model.pth"
  
  optimizer:
    name: Adam
    params:
      lr: 1.0e-4
  
  scheduler:
    name: CosineAnnealingLR
    params:
      T_max: 100
      eta_min: 1.0e-6

exp_name: ShapNetCar/run0