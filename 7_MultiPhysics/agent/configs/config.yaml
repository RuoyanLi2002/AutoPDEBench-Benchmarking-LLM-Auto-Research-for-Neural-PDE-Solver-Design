base_config: configs/base_config.yaml

data:
  field: neutron          # overridden per field by the harness

model:
  input_dim: 2            # overridden per field by the harness
  output_dim: 1           # overridden per field by the harness
  latent_dim: 128
  num_head: 8
  dropout: 0.0
  mlp_ratio: 4.0
  slice_num: 32
  n_layers: 10
  space_dim: 0

training:
  exp_name: NTCouple/agent_shared   # overridden per field by the harness
  seed: 42
  num_epochs: 100
  batch_size: 4
  save_freq: 5
  model_path: "model.pth"

  optimizer:
    name: Adam
    params:
      lr: 1.0e-4

  scheduler:
    name: CosineAnnealingLR
    params:
      T_max: 100
      eta_min: 1.0e-6
