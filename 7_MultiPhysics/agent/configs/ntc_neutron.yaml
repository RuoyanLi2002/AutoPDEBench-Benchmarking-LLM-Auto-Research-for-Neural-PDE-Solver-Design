base_config: configs/base_config.yaml
data:
  field: neutron
model:
  input_dim: 2
  output_dim: 1
  latent_dim: 128
  num_head: 8
  dropout: 0.0
  mlp_ratio: 4.0
  slice_num: 32
  n_layers: 10
  space_dim: 0
training:
  exp_name: NTCouple/ntc_neutron
  seed: 42
  num_epochs: 100
  batch_size: 4
  save_freq: 5
  model_path: "model.pth"
  optimizer:
    name: Adam
    params:
      lr: 1.0e-4
  scheduler:
    name: CosineAnnealingLR
    params:
      T_max: 100
      eta_min: 1.0e-6
