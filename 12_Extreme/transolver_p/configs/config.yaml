data:
  dataset_root: 
  data_save_path: 
  split_interval: 3
  
model:
  input_dim: 6
  latent_dim: 128
  num_head: 8
  dropout: 0.0
  mlp_ratio: 4.0
  slice_num: 32
  n_layers: 5
  output_dim: 6
  space_dim: 0

training:
  exp_name: SuperNova/run0
  seed: 42
  num_epochs: 100
  batch_size: 2
  save_freq: 5
  model_path: "model.pth"
  
  optimizer:
    name: Adam
    params:
      lr: 1.0e-4
  
  scheduler:
    name: CosineAnnealingLR
    params:
      T_max: 100
      eta_min: 1.0e-6

exp_name: SuperNova/run0