data:
  dataset_root: 
  data_save_path: 
  split_interval: 10
  seq_length: 7
  
model:
  trunk_size: 55
  horiz_fourier_dim: 0
  output_size: 2
  space_dim: 2
  attn_type: linear
  ffn_dropout: 0.0
  attn_dropout: 0.0
  n_hidden: 128
  n_head: 8
  n_layers: 6
  act: gelu
  n_experts: 2
  n_inner: 4
  mlp_layers: 2

training:
  exp_name: LGSlosh/run0
  seed: 42
  num_epochs: 100
  batch_size: 4
  save_freq: 5
  model_path: "model.pth"
  
  optimizer:
    name: Adam
    params:
      lr: 1.0e-4
  
  scheduler:
    name: CosineAnnealingLR
    params:
      T_max: 100
      eta_min: 1.0e-6

exp_name: LGSlosh/run0